<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReelsArena Dashboard</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: radial-gradient(circle at center, #080808 0%, #000000 100%);
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin: 0;
      overflow: hidden;
    }

    .welcome {
      font-size: 1.3rem;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #00e0ff, #ff00cc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(255, 0, 204, 0.6);
    }

    .emoji {
      font-size: 11rem;
      animation: bounce 2s infinite ease-in-out, glowShift 4s infinite alternate;
      text-shadow: 0 0 40px #ff00ff, 0 0 80px #00ffff, 0 0 120px #ff00ff;
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-25px);
      }
    }

    @keyframes glowShift {
      0% {
        text-shadow: 0 0 30px #ff00cc, 0 0 60px #ff00cc, 0 0 100px #00e0ff;
      }
      50% {
        text-shadow: 0 0 30px #00e0ff, 0 0 60px #00e0ff, 0 0 100px #ff00cc;
      }
      100% {
        text-shadow: 0 0 30px #ff00cc, 0 0 60px #00e0ff, 0 0 100px #ff00cc;
      }
    }

    h1 {
      margin-top: 25px;
      font-size: 1.8rem;
      text-align: center;
      opacity: 0.9;
      background: linear-gradient(90deg, #00e0ff, #ff00cc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(0, 224, 255, 0.4);
    }

    button {
      margin-top: 40px;
      background: linear-gradient(90deg, #ff00cc, #00e0ff);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 0 20px rgba(255, 0, 204, 0.5);
    }

    button:hover {
      transform: scale(1.07);
      box-shadow: 0 0 25px rgba(0, 224, 255, 0.8);
    }
  </style>
</head>
<body>
  <div class="welcome" id="welcome-text">Welcome!</div>
  <div class="emoji">😝</div>
  <h1>Website still under construction 😅</h1>
  <button id="logout-btn">Logout</button>

  <!-- Firebase Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBjRVoHWTz1Z14ApnLiCTW6zddaWBSaWYU",
      authDomain: "reelsarena-c8f0a.firebaseapp.com",
      projectId: "reelsarena-c8f0a",
      storageBucket: "reelsarena-c8f0a.firebasestorage.app",
      messagingSenderId: "809960694743",
      appId: "1:809960694743:web:b454f4e8b2ce33205c2192",
      measurementId: "G-7F2JDV6RRQ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const welcomeText = document.getElementById("welcome-text");

    // Display user email
    onAuthStateChanged(auth, (user) => {
      if (user) {
        welcomeText.textContent = `Welcome, ${user.email}! 👋`;
      } else {
        window.location.href = "index.html";
      }
    });

    // Logout
    document.getElementById("logout-btn").addEventListener("click", async () => {
      await signOut(auth);
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
