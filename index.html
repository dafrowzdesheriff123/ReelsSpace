<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReelsArena | Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div class="card" id="form-card">
      <div class="logo">
        <div class="diamond">
          <span class="letters">RA</span>
        </div>
        <h1>ReelsArena</h1>
      </div>

      <!-- SIGNUP FORM -->
      <form id="signup-form" class="form">
        <h2>Create Account</h2>
        <input type="text" id="signup-username" placeholder="Username" required />
        <input type="tel" id="signup-phone" placeholder="Phone Number" required />
        <input type="email" id="signup-email" placeholder="Email" required />
        <input type="password" id="signup-password" placeholder="Password" required />
        <input type="password" id="signup-confirm" placeholder="Confirm Password" required />
        <button type="submit">Create Account</button>

        <div class="divider"><span>or continue with</span></div>
        <button type="button" class="google-btn" id="google-signup">
          <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg" alt="Google" />
          Sign up with Google
        </button>

        <p>Already have an account? 
          <a href="#" id="to-login">Login here</a>
        </p>
      </form>

      <!-- LOGIN FORM -->
      <form id="login-form" class="form active">
        <h2>Welcome Back</h2>
        <input type="email" id="login-email" placeholder="Email" required />
        <input type="password" id="login-password" placeholder="Password" required />
        <button type="submit">Login</button>

        <div class="divider"><span>or continue with</span></div>
        <button type="button" class="google-btn" id="google-login">
          <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg" alt="Google" />
          Login with Google
        </button>

        <p>Don’t have an account?
          <a href="#" id="to-signup">Create one</a>
        </p>
      </form>
    </div>
  </div>

  <!-- ====== FORM TOGGLE ====== -->
  <script>
    const signupForm = document.getElementById('signup-form');
    const loginForm = document.getElementById('login-form');
    const toLogin = document.getElementById('to-login');
    const toSignup = document.getElementById('to-signup');

    // Always start with login active
    loginForm.classList.add('active');
    signupForm.classList.remove('active');

    toLogin.addEventListener('click', (e) => {
      e.preventDefault();
      signupForm.classList.remove('active');
      loginForm.classList.add('active');
    });

    toSignup.addEventListener('click', (e) => {
      e.preventDefault();
      loginForm.classList.remove('active');
      signupForm.classList.add('active');
    });
  </script>

  <!-- ====== FIREBASE (SILENT LOGIN + REDIRECT) ====== -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      GoogleAuthProvider, 
      signInWithRedirect, 
      getRedirectResult, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

    // === Your Firebase Configuration ===
    const firebaseConfig = {
      apiKey: "AIzaSyBjRVoHWTz1Z14ApnLiCTW6zddaWBSaWYU",
      authDomain: "reelsarena-c8f0a.firebaseapp.com",
      projectId: "reelsarena-c8f0a",
      storageBucket: "reelsarena-c8f0a.firebasestorage.app",
      messagingSenderId: "809960694743",
      appId: "1:809960694743:web:b454f4e8b2ce33205c2192",
      measurementId: "G-7F2JDV6RRQ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // ===== Silent Auto-Redirect if Already Logged In =====
    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = "dashboard.html";
      }
    });

    // ===== EMAIL SIGNUP =====
    document.getElementById("signup-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const email = document.getElementById("signup-email").value;
      const password = document.getElementById("signup-password").value;
      const confirm = document.getElementById("signup-confirm").value;

      if (password !== confirm) return;

      createUserWithEmailAndPassword(auth, email, password)
        .then(() => window.location.href = "dashboard.html")
        .catch(() => {});
    });

    // ===== EMAIL LOGIN =====
    document.getElementById("login-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const email = document.getElementById("login-email").value;
      const password = document.getElementById("login-password").value;

      signInWithEmailAndPassword(auth, email, password)
        .then(() => window.location.href = "dashboard.html")
        .catch(() => {});
    });

    // ===== GOOGLE LOGIN (Redirect Mode) =====
    document.getElementById("google-login").addEventListener("click", () => {
      signInWithRedirect(auth, provider);
    });

    document.getElementById("google-signup").addEventListener("click", () => {
      signInWithRedirect(auth, provider);
    });

    // ===== Handle Redirect Result =====
    getRedirectResult(auth)
      .then((result) => {
        if (result?.user) window.location.href = "dashboard.html";
      })
      .catch(() => {});
  </script>
</body>
</html>
