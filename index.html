<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReelsArena | Sign Up & Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <!-- Card Wrapper -->
    <div class="card" id="form-card">
      <!-- Logo Section INSIDE card -->
      <div class="logo">
        <div class="diamond">
          <span class="letters">RA</span>
        </div>
        <h1>ReelsArena</h1>
      </div>

      <!-- Signup Form -->
      <form id="signup-form" class="form">
        <h2>Create Account</h2>
        <input type="text" id="signup-username" placeholder="Username" required />
        <input type="tel" id="signup-phone" placeholder="Phone Number" required />
        <input type="email" id="signup-email" placeholder="Email" required />
        <input type="password" id="signup-password" placeholder="Password" required />
        <input type="password" id="signup-confirm" placeholder="Confirm Password" required />
        <button type="submit">Create Account</button>

        <div class="divider">
          <span>or continue with</span>
        </div>
        <button type="button" class="google-btn" id="google-signup">
          <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg" alt="Google" />
          Sign in with Google
        </button>

        <p>Already have an account? 
          <a href="#" id="to-login">Login here</a>
        </p>
      </form>

      <!-- Login Form -->
      <form id="login-form" class="form active">
        <h2>Welcome Back</h2>
        <input type="email" id="login-email" placeholder="Email" required />
        <input type="password" id="login-password" placeholder="Password" required />
        <button type="submit">Login</button>

        <div class="divider">
          <span>or continue with</span>
        </div>
        <button type="button" class="google-btn" id="google-login">
          <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg" alt="Google" />
          Login with Google
        </button>

        <p>Don’t have an account?
          <a href="#" id="to-signup">Create one</a>
        </p>
      </form>
    </div>
  </div>

  <!-- ====== FORM TOGGLE ====== -->
  <script>
    const signupForm = document.getElementById('signup-form');
    const loginForm = document.getElementById('login-form');
    const toLogin = document.getElementById('to-login');
    const toSignup = document.getElementById('to-signup');

    // Start with login form active by default
    loginForm.classList.add('active');
    signupForm.classList.remove('active');

    toLogin.addEventListener('click', (e) => {
      e.preventDefault();
      signupForm.classList.remove('active');
      loginForm.classList.add('active');
    });

    toSignup.addEventListener('click', (e) => {
      e.preventDefault();
      loginForm.classList.remove('active');
      signupForm.classList.add('active');
    });
  </script>

  <!-- ====== FIREBASE CONNECTION ====== -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      GoogleAuthProvider, 
      signInWithPopup 
    } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBjRVoHWTz1Z14ApnLiCTW6zddaWBSaWYU",
      authDomain: "reelsarena-c8f0a.firebaseapp.com",
      projectId: "reelsarena-c8f0a",
      storageBucket: "reelsarena-c8f0a.firebasestorage.app",
      messagingSenderId: "809960694743",
      appId: "1:809960694743:web:b454f4e8b2ce33205c2192",
      measurementId: "G-7F2JDV6RRQ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // ===== SIGNUP =====
    const signup = document.getElementById("signup-form");
    signup.addEventListener("submit", (e) => {
      e.preventDefault();
      const email = document.getElementById("signup-email").value;
      const password = document.getElementById("signup-password").value;
      const confirm = document.getElementById("signup-confirm").value;

      if (password !== confirm) {
        alert("Passwords do not match!");
        return;
      }

      createUserWithEmailAndPassword(auth, email, password)
        .then(() => {
          alert("Account created successfully!");
          window.location.href = "dashboard.html";
        })
        .catch((error) => {
          alert("Signup failed: " + error.message);
        });
    });

    // ===== LOGIN =====
    const login = document.getElementById("login-form");
    login.addEventListener("submit", (e) => {
      e.preventDefault();
      const email = document.getElementById("login-email").value;
      const password = document.getElementById("login-password").value;

      signInWithEmailAndPassword(auth, email, password)
        .then(() => {
          alert("Login successful!");
          window.location.href = "dashboard.html";
        })
        .catch((error) => {
          alert("Login failed: " + error.message);
        });
    });

    // ===== GOOGLE SIGN-IN =====
    document.getElementById("google-login").addEventListener("click", () => {
      signInWithPopup(auth, provider)
        .then(() => {
          alert("Google login successful!");
          window.location.href = "dashboard.html";
        })
        .catch((error) => {
          alert("Google login failed: " + error.message);
        });
    });

    document.getElementById("google-signup").addEventListener("click", () => {
      signInWithPopup(auth, provider)
        .then(() => {
          alert("Google signup successful!");
          window.location.href = "dashboard.html";
        })
        .catch((error) => {
          alert("Google signup failed: " + error.message);
        });
    });
  </script>
</body>
</html>
